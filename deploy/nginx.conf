server {
    listen      80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Nenhum arquivo do site tem hash no nome: index.html, styles.css, data.js e app.js
    # continuam se chamando a mesma coisa a cada deploy. Sem este cabecalho o
    # Cloudflare guarda a versao antiga por 4h (o max-age padrao dele) e o
    # visitante acaba pegando HTML novo com CSS velho — que quebra a pagina.
    #
    # "no-cache" nao proibe guardar: obriga a revalidar. Quando nada mudou a
    # resposta e um 304 vazio, entao o custo e praticamente zero.
    add_header Cache-Control "no-cache" always;

    location / {
        try_files $uri $uri/ =404;
    }
}
